<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f8eef4">
    <meta name="description" content="Wspólna galeria zdjęć i filmów weselnych Patrycji i Karola.">
    
    <!-- Open Graph (Facebook, Messenger, WhatsApp) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://wesele-patrycja-karol.rembiasz.workers.dev/">
    <meta property="og:title" content="Galeria Weselna - Patrycja i Karol">
    <meta property="og:description" content="Dołącz do naszej wspólnej galerii! Przeglądaj i dodawaj zdjęcia oraz filmy z wesela.">
    <meta property="og:image" content="https://wesele-patrycja-karol.rembiasz.workers.dev/preview.jpg">
    
    <!-- Twitter / iMessage (Duży obrazek) -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Galeria Weselna - Patrycja i Karol">
    <meta name="twitter:description" content="Dodaj do naszej wspólnej galerii zdjęcia i filmy.">
    <meta name="twitter:image" content="https://wesele-patrycja-karol.rembiasz.workers.dev/preview.jpg">

    <title>Galeria Weselna - Patrycja i Karol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div id="splash-screen" class="splash-screen">
      <div class="splash-content">
        <img src="/Imie-pani-mlodej.svg" alt="Panna Młoda" class="splash-element splash-bride" onerror="this.style.display='none'">
        <img src="/zdjecie2.svg" alt="Zdjęcie" class="splash-element splash-photo" onerror="this.style.display='none'">
        <img src="/Imie-pana-mlodego.svg" alt="Pan Młody" class="splash-element splash-groom" onerror="this.style.display='none'">
        <img src="/data.svg" alt="Data" class="splash-element splash-date" onerror="this.style.display='none'">
      </div>
    </div>
    <header class="hero">
      <img src="/Patrycja_Karol.svg" alt="Patrycja i Karol" class="hero-logo" onerror="this.style.display='none'">
      <p class="eyebrow">Wspólne wspomnienia</p>
    </header>

    <main>
      <section class="panel upload-panel" aria-labelledby="upload-title">
        <div>
          <h2 id="upload-title">dodaj zdjęcia i filmy</h2>
          <p class="muted">Podczas wysyłania pozostaw tę stronę otwartą.</p>
        </div>

        <label class="primary-button" for="file-input">Wybierz pliki</label>
        <input id="file-input" type="file" accept="image/*,video/*" multiple hidden>

        <p id="upload-summary" class="status" role="status" aria-live="polite"></p>
        <div id="upload-queue" class="upload-queue" aria-live="polite"></div>
      </section>

      <section class="gallery-section" aria-labelledby="gallery-title">
        <div class="section-heading">
          <div>
            <p id="gallery-title" class="eyebrow">Zdjęcia i filmy gości</p>
          </div>
          <div class="gallery-actions">
            <button id="download-selected-button" class="primary-button compact" type="button" hidden>Pobierz zaznaczone</button>
            <button id="clear-selection-button" class="text-button" type="button" hidden>Wyczyść zaznaczenie</button>
            <button id="refresh-button" class="text-button" type="button">Odśwież</button>
          </div>
        </div>

        <p id="gallery-status" class="status" role="status" aria-live="polite">Ładowanie galerii…</p>
        <p id="selection-summary" class="status selection-summary" role="status" aria-live="polite"></p>
        <div id="gallery" class="gallery" aria-live="polite"></div>
      </section>
    </main>

    <dialog id="viewer" class="viewer">
      <div class="viewer-shell">
        <header class="viewer-header">
          <p id="viewer-title" class="viewer-title"></p>
          <button id="viewer-close" class="icon-button" type="button" aria-label="Zamknij podgląd">×</button>
        </header>
        <div class="viewer-nav-container">
          <button id="viewer-prev" class="viewer-nav viewer-prev" type="button" aria-label="Poprzedni" hidden>❮</button>
          <div id="viewer-content" class="viewer-content"></div>
          <button id="viewer-next" class="viewer-nav viewer-next" type="button" aria-label="Następny" hidden>❯</button>
        </div>
        <footer class="viewer-actions">
          <a id="viewer-download" class="primary-button compact" href="#" download>Pobierz</a>
          <a id="viewer-drive" class="secondary-button compact" href="#" target="_blank" rel="noopener">
            Otwórz
            <img src="/Google_Drive_icon_(2020).svg" alt="" class="drive-icon">
          </a>
        </footer>
      </div>
    </dialog>

    <noscript>Ta strona wymaga włączonej obsługi JavaScript.</noscript>
    <script type="module" src="/app.js"></script>
  </body>
</html>
